<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Nền squircle chuẩn mực công nghệ cao -->
  <rect width="32" height="32" rx="8" fill="url(#bg)" />

  <!-- Viền phản quang nhẹ tinh tế -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />

  <!-- Dấu nhắc lệnh Prompt `>` (Biểu tượng Prompt AI) -->
  <path
    d="M7 11.5L12 16L7 20.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Khung Web / Landing Page bán hàng (Biểu tượng ToSite) -->
  <rect x="15" y="9.5" width="11" height="13" rx="2.5" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.2" />
  
  <!-- Thanh điều hướng mini bên trong web -->
  <line x1="15" y1="13" x2="26" y2="13" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />
  <circle cx="17.5" cy="11.2" r="0.7" fill="#38bdf8" />
  <circle cx="19.5" cy="11.2" r="0.7" fill="#93c5fd" />

  <!-- Khối nội dung / thẻ ưu đãi chính màu Cyan phát sáng -->
  <rect x="17" y="15" width="7" height="5" rx="1.2" fill="url(#cardGrad)" />
</svg>

